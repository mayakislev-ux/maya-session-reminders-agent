name: One-time reminder makeup send (2026-09-13, post-חג)

on:
  schedule:
    # 16:45 UTC = 19:45 Israel (UTC+3, DST active in September)
    - cron: "45 16 13 9 *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revert temporary reminder-block value
        run: |
          sed -i 's/,זום-6-נשלח-ידנית,מפגש-6,892697/,זום-6,מפגש-6,892697/' "לוח-מפגשים.csv"
          grep "2026-09-14" "לוח-מפגשים.csv"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send the real reminder
        env:
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
          CONFIRM_LIVE_SEND: "1"
        run: |
          python3 שלח_תזכורות_אוטומטי.py 2026-09-13

      - name: Commit the reverted CSV back to the repo
        run: |
          git config user.email "mayakislev@gmail.com"
          git config user.name "Maya Kislev"
          git add "לוח-מפגשים.csv"
          git commit -m "Revert temporary reminder-block value (חג exception handled, sent 19:45 makeup)" || echo "nothing to commit"
          git push origin HEAD:master || echo "push skipped (workflow token may lack write access - revert manually if needed)"
